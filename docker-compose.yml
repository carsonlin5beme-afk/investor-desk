services:
  postgres:
    image: postgres:16-alpine
    container_name: investor_desk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: investor
      POSTGRES_PASSWORD: investor
      POSTGRES_DB: investor_desk
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investor -d investor_desk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
